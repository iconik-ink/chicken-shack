<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green Acre | Fresh Eggs and Chicken</title>
<meta name="description" content="Free-range eggs and chicken, collected fresh every day.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@400;700&family=Galada&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
:root{--text:#fff;--muted:rgba(255,255,255,.72);--glass:rgba(255,255,255,.06);--glass-b:rgba(255,255,255,.14);--pink:#F9DFC8;--ink:#3A1C12;
--bg-inner:#A67A64;--bg-mid:#7D432E;--bg-outer:#2E160D;
--hen:#C8793A;--hen-hi:#E9A765;--hen-dark:#8E4E1F;--egg:#B9763F;--egg-hi:#E2AE7C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--text:#fff}}
body.alt{--hen:#F4F1EA;--hen-hi:#FFFFFF;--hen-dark:#C9C2B4;--egg:#EFE6D4;--egg-hi:#FFFDF6}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{width:100%;min-width:320px;height:100%}
body{background:radial-gradient(circle at center,var(--bg-inner) 0%,var(--bg-mid) 50%,var(--bg-outer) 100%);color:var(--text);font-family:Inter,sans-serif;overflow:hidden}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubble{position:absolute;bottom:-50px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.8),rgba(255,255,255,.1) 60%,transparent 70%);border:1px solid rgba(255,255,255,.3)}
@keyframes up{0%{transform:translateY(0) translateX(0);opacity:0}10%,90%{opacity:.5}100%{transform:translateY(-110vh) translateX(30px);opacity:0}}
.header{display:flex;justify-content:space-between;align-items:center;gap:1.25rem;padding:2rem 4%;position:fixed;top:env(safe-area-inset-top,0px);width:100%;z-index:100}
.logo{display:flex;align-items:center;gap:.5rem;font:400 1.4rem Galada,cursive;white-space:nowrap}
.nav{display:flex;gap:.5rem;background:rgba(255,255,255,.08);padding:.4rem;border-radius:100px;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav a{font:500 .85rem Manrope,sans-serif;color:var(--muted);text-decoration:none;padding:.5rem 1.2rem;border-radius:100px;transition:.3s}
.nav a:hover,.nav a.active{background:var(--pink);color:var(--ink)}
.contact{background:rgba(0,0,0,.5);color:#fff;border:0;padding:.9rem 2rem;border-radius:100px;font:600 .85rem Inter,sans-serif;cursor:pointer;transition:.3s;white-space:nowrap}
.contact:hover,.shop:hover{background:rgba(0,0,0,.7);transform:translateY(-2px)}
.hero{height:100%;display:flex;padding:5rem 4% 0;position:relative;z-index:1}
.content{display:flex;justify-content:space-between;align-items:stretch;width:100%;height:100%;position:relative}
.title{font:400 clamp(5rem,10vw,12rem)/.8 Galada,cursive;white-space:nowrap}
.left{display:flex;flex-direction:column;height:100%;padding:6rem 0;gap:2rem;z-index:100}
.desc{color:var(--muted);font-size:1.1rem;line-height:1.6;max-width:400px}
.shop{display:flex;align-items:center;gap:1.5rem;background:rgba(0,0,0,.5);color:#fff;border:0;padding:.4rem .4rem .4rem 1.5rem;border-radius:100px;font:700 1rem Inter,sans-serif;cursor:pointer;width:fit-content;transition:.3s}
.plus{background:var(--pink);color:var(--ink);width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:1.4rem;font-weight:900;padding-bottom:2px}
.badge{display:flex;align-items:center;gap:1rem;margin-top:auto}
.badge .ic{width:48px;height:48px;background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.badge b{display:block;font-size:.7rem;letter-spacing:.1em;color:var(--muted);font-weight:400}
.badge span{font-size:.85rem;font-weight:600}
.layer{position:absolute;inset:0;pointer-events:none}
.leaves{z-index:0}.eggs-bg{z-index:0}.eggs-fg{z-index:110}

var hen=document.getElementById("hen"),frame=-1,still=matchMedia("(prefers-reduced-motion: reduce)").matches;
var eggs=document.querySelectorAll(".egg"),leaves=document.querySelectorAll(".leaf");

function swap(t){

 var col=t==="white"?{i:"#DB8D45",m:"#7D432E",o:"#2E160D"}:{i:"#A67A64",m:"#7D432E",o:"#2E160D"};

 var s={v:0,b:0};

  onComplete:function(){body.classList.toggle("alt",t==="white");

  var cx=innerWidth/2-e.offsetLeft-e.offsetWidth/2,cy=innerHeight/2-e.offsetTop-e.offsetHeight/2;
  var a=parseFloat(e.dataset.angle),nx=(Math.random()-.5)*200,ny=(Math.random()-.5)*200;

    e.dataset.bx=nx;e.dataset.by=ny;e.dataset.rx=0;e.dataset.ry=0;if(++done===eggs.length)switching=false}})})}

var mouse={x:0,y:0,px:-1000,py:-1000},cur={x:0,y:0};
addEventListener("mousemove",function(e){mouse.x=e.clientX/innerWidth-.5;mouse.y=e.clientY/innerHeight-.5;mouse.px=e.clientX;mouse.py=e.clientY});
function loop(){
 var t=Date.now()*.001;cur.x+=(mouse.x-cur.x)*.05;cur.y+=(mouse.y-cur.y)*.05;

  if(d>0&&d<400){var f=(400-d)/400;tx=dx/d*f*-80;ty=dy/d*f*-80;sp=1+f*5}

  rx+=(tx-rx)*.1;ry+=(ty-ry)*.1;a+=.12*sp*Math.sin(t*.5+i);
  e.dataset.rx=rx;e.dataset.ry=ry;e.dataset.angle=a;
  var ph=(t+i*.7)*(Math.PI*2/(5+i%5));
  e.style.transform="translate("+(rx+ +e.dataset.bx)+"px,"+(ry+ +e.dataset.by+Math.sin(ph)*15)+"px) rotate("+(a+Math.cos(ph)*6)+"deg)"});
 leaves.forEach(function(l,i){var p=(t+i*1.2)*(Math.PI*2/(10+i*2));l.style.transform="translate("+Math.cos(p*.5)*15+"px,"+Math.sin(p)*20+"px) rotate("+(Math.sin(p*.3)*15+[-25,30,-50,45][i])+"deg)"});
 requestAnimationFrame(loop)}
loop();

if(!matchMedia("(prefers-reduced-motion: reduce)").matches)setInterval(function(){
